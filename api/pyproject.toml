[project]
name = "project-roast-api"
version = "0.1.0"
description = "Project Roast backend (AI Trade Interrogator)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "fastapi>=0.115.0",
  "google-auth>=2.35.0",
  "httpx>=0.27.2",
  "pydantic-settings>=2.4.0",
  "psycopg[binary]>=3.2.0",
  "pyjwt>=2.9.0",
  "pytest>=8.3.0",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.30",
  "uvicorn[standard]>=0.30.6",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
